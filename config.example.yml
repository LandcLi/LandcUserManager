# LandcUserManager 配置示例
#
# 快速开始（零外部依赖）：
#   cp config.example.yml config.yaml
#   go run .            # 自动在 data/landc_user_manager.db 建库建表
#
# 切换到 MySQL（生产环境）：
#   database:
#     driver: "mysql"
#     dsn: "user:password@tcp(127.0.0.1:3306)/landc_user_manager?charset=utf8mb4&parseTime=True&loc=Local"
#     auto_migrate: false        # 生产环境改由 sqls/init.sql 建表
#   redis:
#     addr: "localhost:6379"     # 可选，未配置时自动降级为进程内缓存
#
# 敏感项（jwt.secret / 数据库密码 / 第三方密钥）生产环境请用环境变量注入，
# 例如 LANDC_JWT_SECRET。

# 服务器配置
server:
  port: 18081
  addr: "0.0.0.0"
  read_timeout: 30
  write_timeout: 30
  use_default_routes: true
  health_check:
    enabled: true
    liveness_path: "/health"
    readiness_path: "/ready"
    database_check: true
    redis_check: false
  security_headers:
    enabled: true
  request_timeout: 30

# 数据库配置：默认 SQLite（纯 Go 驱动，无需 CGO / gcc / 外部服务）
database:
  driver: "sqlite"
  dsn: "data/landc_user_manager.db"
  # 开发/测试自动建表；生产环境（MySQL）请设为 false 并执行 sqls/init.sql
  auto_migrate: true
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

# Redis 配置：留空即使用进程内缓存（单实例可用；多实例部署须配置 Redis）
redis:
  addr: ""
  password: ""
  db: 0
  pool_size: 10

# JWT 配置（secret 长度必须 >= 32 字符）
jwt:
  secret: "replace-with-a-strong-secret-key-at-least-32-chars"
  expire_time: "2h"
  issuer: "landc-user-manager"

# 邮件配置（验证码登录需要；未配置时邮件渠道不可用）
email:
  smtp_host: "smtp.example.com"
  smtp_port: 587
  username: "your-email@example.com"
  password: "your-password"
  from: "your-email@example.com"

# 短信配置（验证码登录需要；未配置时短信渠道不可用）
sms:
  api_key: "your-api-key"
  api_secret: "your-api-secret"
  sign_name: "您的签名"
  template: "SMS_123456789"

# 日志配置
logger:
  provider: "file"
  level: "info"
  format: "json"
  outputPath: "./logs"

# 缓存配置
cache:
  user_cache_expire: 3600

# 密码配置
password:
  bcrypt_cost: 10

# 验证码配置
verify_code:
  length: 6
  expire_time: 300

# HTTP 客户端配置
http_client:
  timeout: 10

# 登录历史配置
login_history:
  retention_days: 90

# 限流配置
rate_limit:
  verify_code_interval: 60    # 发送验证码最小间隔（秒）
  max_verify_code_per_day: 10 # 每日发送验证码上限

# 第三方登录配置
third_party:
  wechat:
    app_id: "your-wechat-app-id"
    app_secret: "your-wechat-app-secret"
  github:
    client_id: "your-github-client-id"
    client_secret: "your-github-client-secret"
  dingtalk:
    app_id: "your-dingtalk-app-id"
    app_secret: "your-dingtalk-app-secret"
  alipay:
    app_id: "your-alipay-app-id"
    app_secret: "your-alipay-app-secret"
